<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rogalik Full Fixed</title>

<style>
html,body{margin:0;background:#000;color:#fff;font-family:monospace;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#ui{
 position:fixed;top:6px;left:6px;right:6px;
 background:rgba(0,0,0,.75);padding:6px;border:1px solid #333;font-size:14px
}
#touch{
 position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
 display:grid;grid-template-columns:60px 60px 60px 80px;grid-template-rows:60px 60px 60px;
 gap:6px
}
.btn{
 background:#111;border:1px solid #555;color:#fff;font-size:22px
}
.btn:active{background:#333}
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="ui">
HP <b id="hp"></b> /
<b id="maxhp"></b>
&nbsp; DMG <b id="dmg"></b>
&nbsp; LVL <b id="lvl"></b>
<br>
INV: <span id="inv"></span>
</div>

<div id="touch">
<div></div>
<button class="btn" data-dx="0" data-dy="-1">▲</button>
<div></div>

<button class="btn" data-dx="-1" data-dy="0">◀</button>
<button class="btn" id="wait">●</button>
<button class="btn" data-dx="1" data-dy="0">▶</button>

<div></div>
<button class="btn" data-dx="0" data-dy="1">▼</button>
<div></div>

<button class="btn" id="atk">⚔</button>
<button class="btn" id="pot">🧪</button>
</div>

<script>
/* ================= CONFIG ================= */
const TILE=32, MAP_W=50, MAP_H=50;

/* ================= SPRITES (8x8) ================= */
const SPRITES={
player:[
"00111100","01111110","01101110","01111110","00111100","00100100","01000010","10000001"],
wall:[
"11111111","10101010","11111111","10101010","11111111","10101010","11111111","10101010"],
floor:[
"00000000","00010000","00000000","00100000","00000000","00001000","00000000","00000000"],
chest:[
"01111110","01000010","01111110","01101110","01111110","01000010","01111110","00000000"],
coin:[
"00111100","01111110","01111110","01111110","01111110","01111110","00111100","00000000"],
door_up:[
"00111100","01100110","01100110","01100110","01100110","01100110","01111110","00000000"],
door_down:[
"01111110","01100110","01100110","01100110","01100110","01100110","00111100","00000000"],
monster_chaser:[
"00111100","01011010","01111110","01111110","00111100","01000010","10000001","00000000"],
monster_jumper:[
"00011000","00111100","01111110","00111100","00011000","00100100","01000010","00000000"],
monster_wanderer:[
"00111100","01000010","01011010","01000010","00111100","00011000","00100100","00000000"],
monster_ranged:[
"00111100","01100110","01111110","01011010","00111100","00100100","01000010","00000000"]
};

const COLORS={
player:"#FFD700",wall:"#777",floor:"#111",chest:"#B8860B",coin:"#FFD700",
door_up:"#33FF66",door_down:"#FF3333",
monster_chaser:"#AA55FF",monster_jumper:"#FF5500",
monster_wanderer:"#88CC44",monster_ranged:"#3399FF"
};

/* ================= GAME STATE ================= */
const G={
 map:[],monsters:[],items:[],level:1,
 player:{x:25,y:25,hp:100,maxHp:100,dmg:10,inv:[]}
};

/* ================= EFFECTS ================= */
const FX={
 parts:[],shake:0,flash:0,
 spawn(x,y,c,n=10){
  for(let i=0;i<n;i++)this.parts.push({
   x,y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:30,color:c});
 },
 update(){
  this.parts=this.parts.filter(p=>{
   p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0});
  if(this.shake>0)this.shake--;
  if(this.flash>0)this.flash-=0.05;
 }
};

/* ================= MAP ================= */
function gen(){
 G.map=[];G.monsters=[];G.items=[];
 for(let y=0;y<MAP_H;y++){
  let r=[];
  for(let x=0;x<MAP_W;x++)
   r.push(x==0||y==0||x==MAP_W-1||y==MAP_H-1||Math.random()<0.18?'#':'.');
  G.map.push(r);
 }
 G.map[2][25]='>'; G.map[MAP_H-3][25]='<';

 const mons=["chaser","jumper","wanderer","ranged"];
 for(let i=0;i<6+G.level;i++){
  let x,y;do{x=1+Math.random()*(MAP_W-2)|0;y=1+Math.random()*(MAP_H-2)|0}while(G.map[y][x]=='#');
  G.monsters.push({x,y,type:mons[Math.random()*4|0],hp:20+G.level*5,cd:0});
 }
 for(let i=0;i<8;i++){
  let x,y;do{x=1+Math.random()*(MAP_W-2)|0;y=1+Math.random()*(MAP_H-2)|0}while(G.map[y][x]=='#');
  G.items.push({x,y,type:"chest"});
 }
}

/* ================= RENDER ================= */
const c=document.getElementById("game"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener("resize",resize);resize();

function drawSprite(name,x,y){
 const s=SPRITES[name],px=TILE/8;
 ctx.fillStyle=COLORS[name]||"#fff";
 for(let j=0;j<8;j++)for(let i=0;i<8;i++)
  if(s[j][i]=="1")ctx.fillRect(x+i*px,y+j*px,px,px);
}

let tick=0;
function render(){
 ctx.clearRect(0,0,c.width,c.height);
 let camX=G.player.x*TILE-c.width/2,camY=G.player.y*TILE-c.height/2;
 if(FX.shake){camX+=(Math.random()-.5)*8;camY+=(Math.random()-.5)*8}

 for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
  let px=x*TILE-camX,py=y*TILE-camY;
  if(G.map[y][x]=='#')drawSprite("wall",px,py);
  else drawSprite("floor",px,py);
  if(G.map[y][x]=='>')drawSprite("door_up",px,py);
  if(G.map[y][x]=='<')drawSprite("door_down",px,py);
 }

 G.items.forEach(i=>{
  let px=i.x*TILE-camX,py=i.y*TILE-camY;
  drawSprite(i.type,px,py);
 });

 G.monsters.forEach(m=>{
  let wob=Math.sin(tick/10)*3;
  drawSprite("monster_"+m.type,m.x*TILE-camX,m.y*TILE-camY+wob);
 });

 drawSprite("player",G.player.x*TILE-camX,G.player.y*TILE-camY);

 FX.parts.forEach(p=>{
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x-camX,p.y-camY,3,3);
 });

 if(FX.flash>0){
  ctx.fillStyle=`rgba(255,255,255,${FX.flash})`;
  ctx.fillRect(0,0,c.width,c.height);
 }
}

/* ================= LOGIC ================= */
function step(dx,dy){
 const nx=G.player.x+dx,ny=G.player.y+dy;
 if(G.map[ny][nx]=='#')return;
 if(G.monsters.some(m=>m.x==nx&&m.y==ny))return;
 G.player.x=nx;G.player.y=ny;

 G.items=G.items.filter(i=>{
  if(i.x==nx&&i.y==ny){
   G.player.inv.push("Монета");
   FX.spawn(nx*TILE,ny*TILE,"#ffd700",15);
   return false;
  }
  return true;
 });
}

function attack(){
 G.monsters=G.monsters.filter(m=>{
  let d=Math.abs(m.x-G.player.x)+Math.abs(m.y-G.player.y);
  if(d==1){
   m.hp-=G.player.dmg;
   FX.spawn(m.x*TILE,m.y*TILE,"#ff3333",20);
   FX.flash=.3;FX.shake=6;
  }
  return m.hp>0;
 });
}

/* ================= UI ================= */
function ui(){
 hp.textContent=G.player.hp;
 maxhp.textContent=G.player.maxHp;
 dmg.textContent=G.player.dmg;
 lvl.textContent=G.level;
 inv.textContent=G.player.inv.join(", ")||"—";
}

/* ================= INPUT ================= */
document.querySelectorAll("[data-dx]").forEach(b=>{
 b.onclick=()=>step(+b.dataset.dx,+b.dataset.dy)
});
atk.onclick=attack;
wait.onclick=()=>{};
pot.onclick=()=>{};

/* ================= LOOP ================= */
function loop(){
 tick++;FX.update();render();ui();
 requestAnimationFrame(loop);
}

/* ================= START ================= */
gen();loop();
</script>
</body>
</html>
